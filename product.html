<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Товар - Магазин</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f5f5f5; }
        .product-image { width: 100%; height: 300px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; font-size: 80px; color: white; }
        .product-info { padding: 20px; background: white; border-radius: 20px 20px 0 0; margin-top: -20px; }
        .product-name { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
        .product-price { font-size: 28px; font-weight: 700; color: #e74c3c; margin-bottom: 10px; }
        .product-desc { font-size: 15px; color: #666; line-height: 1.5; margin-bottom: 20px; }
        .back-btn { display: block; text-align: center; background: #667eea; color: white; text-decoration: none; padding: 12px; border-radius: 12px; margin-top: 10px; cursor: pointer; }
        .loading { text-align: center; padding: 50px; color: #666; }
    </style>
</head>
<body>
    <div id="content" class="loading">Загрузка товара...</div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        
        tg.sendData(JSON.stringify({ action: 'get_product', product_id: parseInt(productId) }));
        
        window.addEventListener('message', function(event) {
            try {
                const data = JSON.parse(event.data);
                if (data.success && data.product) {
                    renderProduct(data.product);
                }
            } catch (e) {}
        });
        
        function renderProduct(product) {
            document.getElementById('content').innerHTML = `
                <div class="product-image">📦</div>
                <div class="product-info">
                    <h1 class="product-name">${product.name}</h1>
                    <div class="product-price">${product.price} ₽</div>
                    <div class="product-desc">${product.description}</div>
                    <div class="back-btn" onclick="tg.close()">◀️ Назад к товарам</div>
                </div>
            `;
        }
    </script>
</body>
</html>
