<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Товар - Магазин</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
        }
        .product-image {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            color: white;
        }
        .product-info {
            padding: 20px;
            background: white;
            border-radius: 20px 20px 0 0;
            margin-top: -20px;
        }
        .product-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .product-price {
            font-size: 28px;
            font-weight: 700;
            color: #e74c3c;
            margin-bottom: 10px;
        }
        .product-old-price {
            font-size: 16px;
            color: #999;
            text-decoration: line-through;
            margin-left: 10px;
            font-weight: normal;
        }
        .product-stock {
            font-size: 14px;
            color: #27ae60;
            margin-bottom: 15px;
        }
        .product-category {
            font-size: 14px;
            color: #8b5cf6;
            margin-bottom: 10px;
        }
        .product-desc {
            font-size: 15px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .add-to-cart {
            width: 100%;
            padding: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.2s;
        }
        .add-to-cart:hover {
            background: #5a67d8;
        }
        .back-btn {
            display: block;
            text-align: center;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        .error {
            text-align: center;
            padding: 50px;
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div id="content" class="loading">Загрузка товара...</div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        
        let currentProduct = null;
        
        async function loadProduct() {
            try {
                const response = await fetch('products.json');
                if (!response.ok) {
                    throw new Error('Файл products.json не найден');
                }
                const products = await response.json();
                currentProduct = products.find(p => p.id == productId);
                
                if (currentProduct) {
                    renderProduct(currentProduct);
                } else {
                    document.getElementById('content').innerHTML = `
                        <div class="product-image">❌</div>
                        <div class="product-info">
                            <h1 class="product-name">Товар не найден</h1>
                            <a class="back-btn" href="#" onclick="tg.openLink('/'); return false;">◀️ Назад к товарам</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                document.getElementById('content').innerHTML = `
                    <div class="product-image">❌</div>
                    <div class="product-info">
                        <h1 class="product-name">Ошибка загрузки</h1>
                        <div class="product-desc">Не удалось загрузить данные о товаре</div>
                        <a class="back-btn" href="#" onclick="tg.openLink('/'); return false;">◀️ Назад к товарам</a>
                    </div>
                `;
            }
        }
        
        function renderProduct(product) {
            // Формируем цену со скидкой
            let priceHtml = `<span class="product-price">${product.price} ₽</span>`;
            if (product.old_price && product.old_price > product.price) {
                priceHtml = `<span class="product-price">${product.price} ₽</span>
                            <span class="product-old-price">${product.old_price} ₽</span>`;
            }
            
            // Наличие
            let stockHtml = '';
            if (product.stock > 0) {
                stockHtml = `<div class="product-stock">✅ В наличии: ${product.stock} шт.</div>`;
            } else {
                stockHtml = `<div class="product-stock" style="color: #e74c3c;">❌ Нет в наличии</div>`;
            }
            
            // Категория
            let categoryHtml = '';
            if (product.category && product.category !== 'Без категории') {
                categoryHtml = `<div class="product-category">📁 ${product.category}</div>`;
            }
            
            document.getElementById('content').innerHTML = `
                <div class="product-image">📦</div>
                <div class="product-info">
                    <h1 class="product-name">${escapeHtml(product.name)}</h1>
                    <div>${priceHtml}</div>
                    ${stockHtml}
                    ${categoryHtml}
                    <div class="product-desc">${escapeHtml(product.description)}</div>
                    <button class="add-to-cart" onclick="addToCart()">🛒 Добавить в корзину</button>
                    <a class="back-btn" href="#" onclick="tg.openLink('/'); return false;">◀️ Назад к товарам</a>
                </div>
            `;
        }
        
        function addToCart() {
            tg.showPopup({
                title: '🛒 Добавлено в корзину',
                message: `${currentProduct.name} добавлен в корзину!\n\nСумма: ${currentProduct.price} ₽`,
                buttons: [{type: 'ok'}]
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        loadProduct();
        
        // Настраиваем главную кнопку
        tg.MainButton.setText("🛒 КОРЗИНА");
        tg.MainButton.onClick(() => {
            if (currentProduct) {
                tg.showPopup({
                    title: 'Корзина',
                    message: `Товар "${currentProduct.name}" готов к оформлению!\nСумма: ${currentProduct.price} ₽`,
                    buttons: [{type: 'ok'}]
                });
            } else {
                tg.showPopup({
                    title: 'Корзина',
                    message: 'Выберите товар для добавления',
                    buttons: [{type: 'ok'}]
                });
            }
        });
        tg.MainButton.show();
    </script>
</body>
</html>
