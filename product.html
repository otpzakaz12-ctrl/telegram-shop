<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Товар - Магазин</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
        }
        .product-image {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            color: white;
        }
        .product-info {
            padding: 20px;
            background: white;
            border-radius: 20px 20px 0 0;
            margin-top: -20px;
        }
        .product-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .product-price {
            font-size: 28px;
            font-weight: 700;
            color: #e74c3c;
            margin-bottom: 10px;
        }
        .product-old-price {
            font-size: 16px;
            color: #999;
            text-decoration: line-through;
            margin-left: 10px;
            font-weight: normal;
        }
        .product-stock {
            font-size: 14px;
            color: #27ae60;
            margin-bottom: 15px;
        }
        .product-desc {
            font-size: 15px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .add-to-cart {
            width: 100%;
            padding: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .back-btn {
            display: block;
            text-align: center;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="content">Загрузка...</div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        
        // База товаров (должна совпадать с index.html)
        const products = {
            1: { name: "Кроссовки Nike Air Max", price: 4990, old_price: 5990, desc: "Спортивные кроссовки с дышащим материалом и амортизацией. Размеры: 36-45", stock: 50 },
            2: { name: "Футболка Adidas Originals", price: 1990, old_price: 2990, desc: "Хлопковая футболка с принтом, отличное качество. Размеры: S-XXL", stock: 100 },
            3: { name: "Рюкзак Puma Essential", price: 3490, old_price: 0, desc: "Водонепроницаемый рюкзак, 20 литров, удобные лямки", stock: 30 },
            4: { name: "Часы Casio Classic", price: 2990, old_price: 3990, desc: "Классические наручные часы с хронографом, водонепроницаемые", stock: 15 },
            5: { name: "Шапка Nike Therma", price: 1490, old_price: 0, desc: "Тёплая шапка с технологией сохранения тепла", stock: 40 },
            6: { name: "Носки Adidas 3 пары", price: 590, old_price: 990, desc: "Спортивные носки, дышащий материал, 3 пары", stock: 120 }
        };
        
        const product = products[productId];
        
        if (product) {
            // Формируем цену со скидкой
            let priceHtml = `<span class="product-price">${product.price} ₽</span>`;
            if (product.old_price && product.old_price > product.price) {
                priceHtml = `<span class="product-price">${product.price} ₽</span>
                            <span class="product-old-price">${product.old_price} ₽</span>`;
            }
            
            document.getElementById('content').innerHTML = `
                <div class="product-image">📦</div>
                <div class="product-info">
                    <h1 class="product-name">${product.name}</h1>
                    <div>${priceHtml}</div>
                    <div class="product-stock">✅ В наличии: ${product.stock} шт.</div>
                    <div class="product-desc">${product.desc}</div>
                    <button class="add-to-cart" onclick="addToCart()">🛒 Добавить в корзину</button>
                    <a class="back-btn" href="#" onclick="tg.openLink('/'); return false;">◀️ Назад к товарам</a>
                </div>
            `;
        } else {
            document.getElementById('content').innerHTML = `
                <div class="product-image">❌</div>
                <div class="product-info">
                    <h1 class="product-name">Товар не найден</h1>
                    <a class="back-btn" href="#" onclick="tg.openLink('/'); return false;">◀️ Назад к товарам</a>
                </div>
            `;
        }
        
        function addToCart() {
            tg.showPopup({
                title: '🛒 Добавлено в корзину',
                message: `${product.name} добавлен в корзину!\n\nКоличество: 1 шт\nСумма: ${product.price} ₽`,
                buttons: [{type: 'ok'}]
            });
        }
        
        // Настраиваем главную кнопку
        tg.MainButton.setText("🛒 КОРЗИНА");
        tg.MainButton.onClick(() => {
            tg.showPopup({
                title: 'Корзина',
                message: 'Товар добавлен в корзину! Оформите заказ через менеджера.',
                buttons: [{type: 'ok'}]
            });
        });
        tg.MainButton.show();
    </script>
</body>
</html>
