<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Товар - Магазин</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            overflow-x: hidden;
        }
        /* Карусель фото */
        .carousel-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            background: #000;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.3s ease-out;
            touch-action: pan-y pinch-zoom;
        }
        .carousel-slide {
            flex-shrink: 0;
            width: 100%;
        }
        .carousel-slide img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }
        .carousel-slide .no-image {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            color: white;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            font-size: 24px;
            color: white;
            transition: background 0.2s;
        }
        .carousel-btn.prev {
            left: 10px;
        }
        .carousel-btn.next {
            right: 10px;
        }
        .carousel-dots {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 10;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            transition: all 0.2s;
        }
        .dot.active {
            width: 20px;
            border-radius: 4px;
            background: white;
        }
        .product-info {
            padding: 20px;
            background: white;
            border-radius: 20px 20px 0 0;
            margin-top: -20px;
            position: relative;
        }
        .product-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .product-price {
            font-size: 28px;
            font-weight: 700;
            color: #e74c3c;
            margin-bottom: 10px;
        }
        .product-old-price {
            font-size: 16px;
            color: #999;
            text-decoration: line-through;
            margin-left: 10px;
            font-weight: normal;
        }
        .product-stock {
            font-size: 14px;
            margin-bottom: 15px;
        }
        .in-stock {
            color: #27ae60;
        }
        .out-of-stock {
            color: #e74c3c;
        }
        .product-category {
            font-size: 14px;
            color: #8b5cf6;
            margin-bottom: 10px;
        }
        .product-desc {
            font-size: 15px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .add-to-cart {
            width: 100%;
            padding: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .add-to-cart.disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .back-btn {
            display: block;
            text-align: center;
            background: #667eea;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }
        .loading, .error {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        .error {
            color: #e74c3c;
        }
        .photo-counter {
            position: absolute;
            top: 10px;
            right: 15px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="content" class="loading">Загрузка товара...</div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        let currentProduct = null;
        let currentPhotoIndex = 0;
        let isLoading = false;
        
        // Функция отправки запроса к боту
        function sendToBot(action, data = {}) {
            return new Promise((resolve, reject) => {
                const requestData = { action, ...data };
                requestData.initData = tg.initData;
                
                const handler = (event) => {
                    try {
                        const response = JSON.parse(event.data);
                        resolve(response);
                    } catch (e) {
                        reject(e);
                    }
                    tg.offEvent('mainButtonClicked', handler);
                };
                
                tg.onEvent('mainButtonClicked', handler);
                tg.sendData(JSON.stringify(requestData));
                
                setTimeout(() => {
                    tg.offEvent('mainButtonClicked', handler);
                    reject(new Error('Timeout'));
                }, 10000);
            });
        }
        
        async function loadProduct() {
            if (isLoading) return;
            isLoading = true;
            
            document.getElementById('content').innerHTML = '<div class="loading">Загрузка товара...</div>';
            
            try {
                const response = await sendToBot('get_product', { product_id: parseInt(productId) });
                
                if (response.error) {
                    throw new Error(response.error);
                }
                
                if (response.success && response.product) {
                    currentProduct = response.product;
                    renderProduct();
                } else {
                    throw new Error('Товар не найден');
                }
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                document.getElementById('content').innerHTML = `<div class="error">❌ ${error.message}</div>`;
            } finally {
                isLoading = false;
            }
        }
        
        function renderProduct() {
            const inStock = currentProduct.stock > 0;
            const photos = currentProduct.photos || [];
            const totalPhotos = photos.length;
            
            let priceHtml = `<span class="product-price">${currentProduct.price} ₽</span>`;
            if (currentProduct.old_price && currentProduct.old_price > currentProduct.price) {
                priceHtml = `<span class="product-price">${currentProduct.price} ₽</span><span class="product-old-price">${currentProduct.old_price} ₽</span>`;
            }
            
            // Генерируем слайды карусели
            let slidesHtml = '';
            if (totalPhotos > 0) {
                for (let i = 0; i < totalPhotos; i++) {
                    slidesHtml += `
                        <div class="carousel-slide">
                            <img src="${photos[i]}" alt="Фото ${i+1}" loading="lazy">
                        </div>
                    `;
                }
            } else {
                slidesHtml = `
                    <div class="carousel-slide">
                        <div class="no-image">📦</div>
                    </div>
                `;
            }
            
            // Индикаторы
            let dotsHtml = '';
            for (let i = 0; i < Math.max(totalPhotos, 1); i++) {
                dotsHtml += `<div class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`;
            }
            
            document.getElementById('content').innerHTML = `
                <div class="carousel-container" style="position: relative;">
                    <div class="carousel-track" id="carouselTrack">
                        ${slidesHtml}
                    </div>
                    ${totalPhotos > 1 ? `
                        <div class="carousel-btn prev" id="prevBtn">‹</div>
                        <div class="carousel-btn next" id="nextBtn">›</div>
                        <div class="carousel-dots" id="carouselDots">${dotsHtml}</div>
                        <div class="photo-counter" id="photoCounter">1 / ${totalPhotos}</div>
                    ` : ''}
                </div>
                <div class="product-info">
                    <h1 class="product-name">${escapeHtml(currentProduct.name)}</h1>
                    <div>${priceHtml}</div>
                    <div class="product-stock ${inStock ? 'in-stock' : 'out-of-stock'}">${inStock ? `✅ В наличии: ${currentProduct.stock} шт.` : '❌ Нет в наличии'}</div>
                    <div class="product-category">📁 ${escapeHtml(currentProduct.category)}</div>
                    <div class="product-desc">${escapeHtml(currentProduct.description)}</div>
                    <button class="add-to-cart ${!inStock ? 'disabled' : ''}" ${!inStock ? 'disabled' : ''} onclick="addToCart()">🛒 Добавить в корзину</button>
                    <button class="back-btn" onclick="tg.close()">◀️ Назад к товарам</button>
                </div>
            `;
            
            if (totalPhotos > 1) {
                initCarousel(totalPhotos);
            }
        }
        
        function initCarousel(totalPhotos) {
            const track = document.getElementById('carouselTrack');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const dots = document.querySelectorAll('.dot');
            const counter = document.getElementById('photoCounter');
            
            function updateCarousel() {
                const slideWidth = track.parentElement.clientWidth;
                track.style.transform = `translateX(-${currentPhotoIndex * slideWidth}px)`;
                dots.forEach((dot, i) => dot.classList.toggle('active', i === currentPhotoIndex));
                if (counter) counter.textContent = `${currentPhotoIndex + 1} / ${totalPhotos}`;
            }
            
            function nextPhoto() {
                if (currentPhotoIndex < totalPhotos - 1) {
                    currentPhotoIndex++;
                    updateCarousel();
                }
            }
            
            function prevPhoto() {
                if (currentPhotoIndex > 0) {
                    currentPhotoIndex--;
                    updateCarousel();
                }
            }
            
            prevBtn.addEventListener('click', prevPhoto);
            nextBtn.addEventListener('click', nextPhoto);
            dots.forEach((dot, i) => dot.addEventListener('click', () => {
                currentPhotoIndex = i;
                updateCarousel();
            }));
            
            // Свайп
            let startX = 0;
            track.addEventListener('touchstart', (e) => startX = e.touches[0].clientX);
            track.addEventListener('touchmove', (e) => {
                const diff = e.touches[0].clientX - startX;
                if (Math.abs(diff) > 50) {
                    diff > 0 ? prevPhoto() : nextPhoto();
                    startX = e.touches[0].clientX;
                }
            });
            
            window.addEventListener('resize', () => updateCarousel());
            updateCarousel();
        }
        
        async function addToCart() {
            if (currentProduct.stock <= 0) return;
            
            try {
                const response = await sendToBot('add_to_cart', {
                    product_id: currentProduct.id,
                    quantity: 1
                });
                
                if (response.success) {
                    tg.showPopup({
                        title: '🛒 Добавлено в корзину',
                        message: `${currentProduct.name} добавлен в корзину!\nСумма: ${currentProduct.price} ₽`,
                        buttons: [{type: 'ok'}]
                    });
                } else {
                    throw new Error('Ошибка добавления');
                }
            } catch (error) {
                tg.showPopup({
                    title: 'Ошибка',
                    message: 'Не удалось добавить товар в корзину',
                    buttons: [{type: 'ok'}]
                });
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        loadProduct();
        
        tg.MainButton.setText("🛒 КОРЗИНА");
        tg.MainButton.onClick(async () => {
            try {
                const response = await sendToBot('get_cart');
                if (response.success && response.cart && response.cart.items.length > 0) {
                    let message = '🛒 ВАША КОРЗИНА:\n\n';
                    response.cart.items.forEach(item => {
                        message += `${item.name} x${item.quantity} = ${item.subtotal} ₽\n`;
                    });
                    message += `\n💰 ИТОГО: ${response.cart.total} ₽`;
                    tg.showPopup({ title: 'Корзина', message, buttons: [{type: 'ok'}] });
                } else {
                    tg.showPopup({ title: 'Корзина', message: 'Ваша корзина пуста', buttons: [{type: 'ok'}] });
                }
            } catch (error) {
                tg.showPopup({ title: 'Ошибка', message: 'Не удалось загрузить корзину', buttons: [{type: 'ok'}] });
            }
        });
        tg.MainButton.show();
    </script>
</body>
</html>
