<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Магазин - Каталог</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            padding: 16px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .cart-info {
            background: white;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .cart-info span {
            font-size: 16px;
            font-weight: 600;
        }

        .cart-info a {
            background: #667eea;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #e0e0e0;
        }

        .product-image-placeholder {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .product-info {
            padding: 12px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: #e74c3c;
            margin-bottom: 4px;
        }

        .product-old-price {
            font-size: 11px;
            color: #999;
            text-decoration: line-through;
            margin-left: 6px;
            font-weight: normal;
        }

        .product-stock {
            font-size: 11px;
            color: #27ae60;
        }

        .product-stock.out {
            color: #e74c3c;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #e74c3c;
        }

        @media (max-width: 480px) {
            .products-grid {
                gap: 12px;
            }

            .product-image, .product-image-placeholder {
                height: 150px;
            }

            .product-name {
                font-size: 12px;
            }

            .product-price {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛍 МАГАЗИН</h1>
        <p>Лучшие товары по лучшим ценам</p>
    </div>

    <div class="cart-info">
        <span>🛒 <span id="cart-count">0</span> товаров</span>
        <a href="#" onclick="Telegram.WebApp.close()">📞 Связаться</a>
    </div>

    <div id="products-container" class="products-grid">
        <div class="loading">Загрузка товаров...</div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // Получаем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        const startParam = urlParams.get('start');

        // Функция загрузки товаров
        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                const products = await response.json();

                const container = document.getElementById('products-container');
                container.innerHTML = '';

                if (products.length === 0) {
                    container.innerHTML = '<div class="error">😕 Товары временно недоступны</div>';
                    return;
                }

                products.forEach(product => {
                    const card = document.createElement('a');
                    card.className = 'product-card';
                    card.href = `/product.html?id=${product.id}`;
                    card.onclick = (e) => {
                        e.preventDefault();
                        tg.openLink(`/product.html?id=${product.id}`);
                    };

                    // Фото
                    let imageHtml = '';
                    if (product.photos && product.photos.length > 0) {
                        imageHtml = `<img class="product-image" src="${product.photos[0]}" alt="${product.name}">`;
                    } else {
                        imageHtml = `<div class="product-image-placeholder">📦</div>`;
                    }

                    // Цена со скидкой
                    let priceHtml = `<span class="product-price">${product.price} ₽</span>`;
                    if (product.old_price && product.old_price > product.price) {
                        priceHtml = `<span class="product-price">${product.price} ₽</span>
                                    <span class="product-old-price">${product.old_price} ₽</span>`;
                    }

                    // Наличие
                    let stockHtml = '';
                    if (product.stock > 0) {
                        stockHtml = `<div class="product-stock">✅ В наличии: ${product.stock} шт.</div>`;
                    } else {
                        stockHtml = `<div class="product-stock out">❌ Нет в наличии</div>`;
                    }

                    card.innerHTML = `
                        ${imageHtml}
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                            <div>${priceHtml}</div>
                            ${stockHtml}
                        </div>
                    `;

                    container.appendChild(card);
                });

                updateCartCount();
            } catch (error) {
                console.error('Ошибка загрузки товаров:', error);
                document.getElementById('products-container').innerHTML = '<div class="error">❌ Ошибка загрузки товаров</div>';
            }
        }

        // Загрузка корзины
        async function updateCartCount() {
            try {
                const response = await fetch('/api/cart/count');
                const data = await response.json();
                document.getElementById('cart-count').innerText = data.count;
                tg.MainButton.setText(`🛒 Корзина (${data.count})`);
                tg.MainButton.show();
            } catch (error) {
                console.error('Ошибка загрузки корзины:', error);
            }
        }

        // Кнопка корзины
        tg.MainButton.setText('🛒 Корзина (0)');
        tg.MainButton.onClick(() => {
            tg.openLink('/cart.html');
        });

        // Загрузка товаров
        loadProducts();
    </script>
</body>
</html>
