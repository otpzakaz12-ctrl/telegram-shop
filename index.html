<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Каталог - Магазин</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f5f5f5; padding: 16px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; text-align: center; }
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .product-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-4px); }
        .product-image { width: 100%; height: 160px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; font-size: 48px; color: white; overflow: hidden; }
        .product-image img { width: 100%; height: 100%; object-fit: cover; }
        .product-info { padding: 12px; }
        .product-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        .product-price { font-size: 16px; font-weight: 700; color: #e74c3c; }
        .loading { text-align: center; padding: 40px; color: #666; grid-column: span 2; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛍 МАГАЗИН</h1>
        <p>Лучшие товары по лучшим ценам</p>
    </div>
    <div id="products" class="products-grid">
        <div class="loading">Загрузка товаров...</div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Отправляем запрос к боту через WebApp
        tg.sendData(JSON.stringify({ action: 'get_products' }));
        
        // Обработка ответа от бота
        window.addEventListener('message', function(event) {
            try {
                const data = JSON.parse(event.data);
                if (data.success && data.products) {
                    renderProducts(data.products);
                }
            } catch (e) {}
        });
        
        function renderProducts(products) {
            const container = document.getElementById('products');
            if (!products || products.length === 0) {
                container.innerHTML = '<div class="loading">😕 Товары временно недоступны</div>';
                return;
            }
            container.innerHTML = '';
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => tg.openLink(`product.html?id=${product.id}`);
                card.innerHTML = `
                    <div class="product-image">📦</div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">${product.price} ₽</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
