<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Каталог - Магазин</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f5f5f5; padding: 16px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; text-align: center; }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .product-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; text-decoration: none; color: inherit; display: block; }
        .product-card:hover { transform: translateY(-4px); }
        .product-image { width: 100%; height: 160px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; font-size: 48px; color: white; overflow: hidden; }
        .product-image img { width: 100%; height: 100%; object-fit: cover; }
        .product-info { padding: 12px; }
        .product-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price { font-size: 16px; font-weight: 700; color: #e74c3c; }
        .loading, .error { text-align: center; padding: 40px; color: #666; grid-column: span 2; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛍 МАГАЗИН</h1>
        <p>Лучшие товары по лучшим ценам</p>
    </div>
    <div id="products" class="products-grid">
        <div class="loading">Загрузка товаров...</div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        
        let products = [];
        
        // Отправляем запрос к боту
        tg.sendData(JSON.stringify({ action: 'get_products' }));
        
        // Обработка ответа от бота
        window.addEventListener('message', function(event) {
            try {
                const data = JSON.parse(event.data);
                if (data.success && data.products) {
                    products = data.products;
                    renderProducts();
                } else if (data.error) {
                    showError(data.error);
                }
            } catch (e) {}
        });
        
        function renderProducts() {
            const container = document.getElementById('products');
            
            if (!products || products.length === 0) {
                container.innerHTML = '<div class="error">😕 Товары временно недоступны</div>';
                return;
            }
            
            container.innerHTML = '';
            
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => {
                    tg.openLink(`product.html?id=${product.id}`);
                };
                
                // Фото загружаем с GitHub
                const photoUrl = `photos/${product.id}/1.jpg`;
                
                card.innerHTML = `
                    <div class="product-image">
                        <img src="${photoUrl}" alt="${escapeHtml(product.name)}" 
                             onerror="this.parentElement.innerHTML='📦';this.parentElement.style.fontSize='48px'">
                    </div>
                    <div class="product-info">
                        <div class="product-name">${escapeHtml(product.name)}</div>
                        <div class="product-price">${product.price} ₽</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        function showError(error) {
            document.getElementById('products').innerHTML = `<div class="error">❌ Ошибка: ${escapeHtml(error)}</div>`;
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Настраиваем главную кнопку
        tg.MainButton.setText("🛒 КОРЗИНА");
        tg.MainButton.onClick(() => {
            tg.showPopup({
                title: 'Корзина',
                message: 'Нажмите на товар, чтобы добавить в корзину',
                buttons: [{type: 'ok'}]
            });
        });
        tg.MainButton.show();
    </script>
</body>
</html>
