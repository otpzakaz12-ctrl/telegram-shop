<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Каталог - Магазин</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            padding: 16px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .product-image {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }
        .product-info {
            padding: 12px;
        }
        .product-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: #e74c3c;
        }
        .product-old-price {
            font-size: 11px;
            color: #999;
            text-decoration: line-through;
            margin-left: 6px;
            font-weight: normal;
        }
        @media (max-width: 480px) {
            .product-image {
                height: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛍 МАГАЗИН</h1>
        <p>Лучшие товары по лучшим ценам</p>
    </div>
    <div id="products" class="products-grid"></div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        
        // ТОВАРЫ (ДОБАВЬТЕ ВАШИ ТОВАРЫ СЮДА)
        const products = [
            { id: 1, name: "Кроссовки Nike Air Max", price: 4990, old_price: 5990, desc: "Спортивные кроссовки с дышащим материалом. Размеры: 36-45" },
            { id: 2, name: "Футболка Adidas Originals", price: 1990, old_price: 2990, desc: "Хлопковая футболка с принтом. Размеры: S-XXL" },
            { id: 3, name: "Рюкзак Puma Essential", price: 3490, old_price: 0, desc: "Водонепроницаемый рюкзак, 20 литров" },
            { id: 4, name: "Часы Casio Classic", price: 2990, old_price: 3990, desc: "Классические наручные часы с хронографом" },
            { id: 5, name: "Шапка Nike Therma", price: 1490, old_price: 0, desc: "Тёплая шапка с технологией сохранения тепла" },
            { id: 6, name: "Носки Adidas 3 пары", price: 590, old_price: 990, desc: "Спортивные носки, дышащий материал" }
        ];
        
        const container = document.getElementById('products');
        
        function renderProducts() {
            container.innerHTML = '';
            
            products.forEach(product => {
                const card = document.createElement('a');
                card.className = 'product-card';
                card.href = `product.html?id=${product.id}`;
                card.onclick = (e) => {
                    e.preventDefault();
                    tg.openLink(`product.html?id=${product.id}`);
                };
                
                // Цена со скидкой
                let priceHtml = `<span class="product-price">${product.price} ₽</span>`;
                if (product.old_price && product.old_price > product.price) {
                    priceHtml = `<span class="product-price">${product.price} ₽</span>
                                <span class="product-old-price">${product.old_price} ₽</span>`;
                }
                
                card.innerHTML = `
                    <div class="product-image">📦</div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div>${priceHtml}</div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }
        
        renderProducts();
        
        // Настраиваем главную кнопку
        tg.MainButton.setText("🛒 КОРЗИНА");
        tg.MainButton.onClick(() => {
            tg.showPopup({
                title: 'Корзина',
                message: 'Добавьте товар в корзину через карточку товара',
                buttons: [{type: 'ok'}]
            });
        });
        tg.MainButton.show();
    </script>
</body>
</html>
